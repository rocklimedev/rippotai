<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO Improvements -->
    <title>
      Rippotai Architecture | Best Architecture Firm in New Delhi, India
    </title>
    <meta
      name="description"
      content="Rippotai Architecture is a leading architecture and interior design firm in New Delhi, specializing in residential, institutional, and innovative projects. Explore our portfolio of modern, sustainable designs."
    />
    <meta
      name="keywords"
      content="architecture firm New Delhi, interior designers Delhi, residential architects India, institutional architecture, modern home design Delhi, Rippotai Architecture"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Rippotai Architecture" />

    <!-- Open Graph / Social Media Tags (for better sharing on Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta
      property="og:title"
      content="Rippotai Architecture | Innovative Architecture & Interior Design in New Delhi"
    />
    <meta
      property="og:description"
      content="Discover award-winning residential and institutional projects by Rippotai Architecture, a premier design firm in New Delhi, India."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rippotaiarchitecture.com/" />
    <meta
      property="og:image"
      content="https://rippotaiarchitecture.com/logo.png"
    />
    <!-- Replace with your actual OG image URL (recommended size: 1200x630) -->
    <meta property="og:site_name" content="Rippotai Architecture" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Rippotai Architecture | Innovative Architecture & Interior Design in New Delhi"
    />
    <meta
      name="twitter:description"
      content="Discover award-winning residential and institutional projects by Rippotai Architecture, a premier design firm in New Delhi, India."
    />
    <meta
      name="twitter:image"
      content="https://rippotaiarchitecture.com/logo.png"
    />

    <!-- Replace with your Twitter handle if available -->

    <!-- Canonical URL -->
    <link rel="canonical" href="https://rippotaiarchitecture.com/" />

    <!-- Favicon & Apple Touch Icon -->
    <link rel="apple-touch-icon" href="./logo.png" />

    <!-- Fonts Preconnect (already present - good for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS CDN (unchanged) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Bootstrap JS Bundle (unchanged) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
