name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "rippotai-backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.RIPPOTAI_GHCR_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ghcr.io/rocklimedev/rippotai-backend:latest ./rippotai-backend
          docker push ghcr.io/rocklimedev/rippotai-backend:latest
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/rocklimedev/rippotai-backend:latest)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: SSH & Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: 22
          timeout: 30m
          script: |
            set -e
            cd /root/rippotai-backend

            echo "${{ secrets.RIPPOTAI_GHCR_TOKEN }}" | docker login ghcr.io \
              -u rocklimedev --password-stdin
            # Pull the exact image using digest
            docker compose pull rippotai-backend

            # Start container
            docker compose up -d rippotai-backend --force-recreate --pull always
            docker image prune -f
