name: Deploy Rippotai Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build --no-cache -t ghcr.io/rocklimedev/rippotai-backend:latest .
          docker push ghcr.io/rocklimedev/rippotai-backend:latest

      # 5️⃣ Deploy to VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /root

            # Clone repo if it doesn't exist, else pull latest
            if [ ! -d rippotai-backend ]; then
              git clone https://github.com/rocklimedev/rippotai-backend.git
            else
              cd rippotai-backend
              git reset --hard
              git pull
            fi

            cd rippotai-backend

            # Log in to GHCR on the VPS
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u rocklimedev --password-stdin

            # Pull latest Docker image
            docker compose pull backend

            # Recreate container
            docker compose up -d backend --force-recreate --pull always

            # Cleanup old images
            docker image prune -f
