name: Deploy Rippotai Backend

on:
  push:
    branches:
      - main
    paths:
      - "rippotai-backend/**"
      - "docker-compose.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.GHCR_PAT }}

      # 4️⃣ Build & push backend image
      - name: Build and push backend image
        run: |
          docker build --no-cache \
            -t ghcr.io/rocklimedev/rippotai-backend:latest \
            ./rippotai-backend
          docker push ghcr.io/rocklimedev/rippotai-backend:latest

      # 5️⃣ Deploy on VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd /root

            # Remove old backend folder if exists (clean deploy)
            if [ -d rippotai-backend ]; then
              rm -rf rippotai-backend
            fi

            # Clone only the backend folder
            git clone --depth=1 --filter=blob:none --sparse https://github.com/rocklimedev/rippotai.git rippotai-backend
            cd rippotai-backend
            git sparse-checkout set rippotai-backend
            git pull origin main

            # Login to GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u rocklimedev --password-stdin

            # Pull latest Docker image
            docker compose pull

            # Restart backend
            docker compose up -d --force-recreate

            # Cleanup dangling images
            docker image prune -f
