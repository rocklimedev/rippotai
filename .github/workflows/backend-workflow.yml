name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "rippotai-backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.RIPPOTAI_GHCR_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build \
            -t ghcr.io/rocklimedev/rippotai-backend:latest \
            ./rippotai-backend

          docker push \
            ghcr.io/rocklimedev/rippotai-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR="/opt/apps/rippotai-backend"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"

            echo "======================================"
            echo "Rippotai Backend Deployment"
            echo "======================================"

            echo "==> Checking deployment directory"
            test -d "$APP_DIR"
            test -f "$COMPOSE_FILE"

            cd "$APP_DIR"

            echo "==> Current directory:"
            pwd

            echo "==> Compose file:"
            ls -la "$COMPOSE_FILE"

            echo "==> Logging into GHCR"
            echo "${{ secrets.RIPPOTAI_GHCR_TOKEN }}" | docker login ghcr.io \
              -u rocklimedev \
              --password-stdin

            echo "==> Pulling latest backend image"
            docker compose -f "$COMPOSE_FILE" pull

            echo "==> Recreating backend containers"
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate

            echo "==> Backend container status"
            docker compose -f "$COMPOSE_FILE" ps

            echo "==> Running backend containers"
            docker ps \
              --filter "name=rippotai-backend" \
              --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "==> Cleaning unused Docker images"
            docker image prune -f

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"
