name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RIPPOTAI_GHCR_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ghcr.io/rocklimedev/rippotai-backend:latest ./rippotai-backend
          docker push ghcr.io/rocklimedev/rippotai-backend:latest
          # Get the image digest
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/rocklimedev/rippotai-backend:latest)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: SSH & Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: 22
          timeout: 30m # 30 minutes
          script: |
            set -e
            cd /home/ubuntu/rippotai

            # Pull latest code
            if [ ! -d rippotai ]; then
              git clone https://github.com/rocklimedev/rippotai.git
            fi
            cd rippotai
            git fetch origin main
            git reset --hard origin/main

            cd rippotai-backend

            # Prune old containers/images
            docker container prune -f
            docker image prune -f

            # Pull the exact image using digest
            docker pull $IMAGE_DIGEST

            # Bring up container using fixed image
            docker compose up -d rippotai-backend --force-recreate
