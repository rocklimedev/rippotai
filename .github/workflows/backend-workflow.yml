name: Deploy Rippotai Backend

on:
  push:
    branches:
      - main
    paths:
      - "rippotai-backend/**"
      - ".github/workflows/backend-workflow.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.GHCR_PAT }}

      # 4️⃣ Build & push backend image
      - name: Build and push backend image
        run: |
          docker build \
            -t ghcr.io/rocklimedev/rippotai-backend:latest \
            ./rippotai-backend
          docker push ghcr.io/rocklimedev/rippotai-backend:latest

      # 5️⃣ Deploy on VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd /root

            if [ ! -d rippotai ]; then
              git clone https://github.com/rocklimedev/rippotai.git
            fi

            cd /root/rippotai
            git pull origin main

            cd rippotai-backend

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u rocklimedev --password-stdin

            docker compose pull
            docker compose up -d rippotai-backend --force-recreate

            docker image prune -f
