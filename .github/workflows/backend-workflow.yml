name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          # Only checkout the backend folder to save bandwidth (optional)
          path: rippotai-backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RIPPOTAI_GHCR_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ghcr.io/rocklimedev/rippotai-backend:latest ./rippotai-backend
          docker push ghcr.io/rocklimedev/rippotai-backend:latest
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/rocklimedev/rippotai-backend:latest)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: SSH & Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: 22
          timeout: 30m
          script: |
            set -e
            cd /root/

            # If backend folder doesn't exist, clone only backend folder
            if [ ! -d rippotai-backend ]; then
              git clone --depth 1 --filter=blob:none --sparse https://github.com/rocklimedev/rippotai.git
              cd rippotai
              git sparse-checkout set rippotai-backend
              mv rippotai-backend ../
              cd ..
              rm -rf rippotai
            fi

            cd /root/rippotai-backend

            # Pull latest backend updates
            git fetch origin main
            git reset --hard origin/main

            # Cleanup old containers/images
            docker container prune -f
            docker image prune -f

            # Pull the exact image using digest
            docker pull $IMAGE_DIGEST

            # Start container
            docker compose up -d rippotai-backend --force-recreate
