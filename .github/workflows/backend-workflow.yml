name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "rippotai-backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.RIPPOTAI_GHCR_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build -t ghcr.io/rocklimedev/rippotai-backend:latest ./rippotai-backend
          docker push ghcr.io/rocklimedev/rippotai-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.RIPPOTAI_VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/rippotai-backend

            echo "${{ secrets.RIPPOTAI_GHCR_TOKEN }}" | docker login ghcr.io \
              -u rocklimedev --password-stdin

            docker compose down
            docker compose pull
            docker compose up -d --force-recreate

            docker image prune -f
