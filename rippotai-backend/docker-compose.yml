version: "3.9"

services:
  backend:
    build: .
    container_name: rippotai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/rippotai
    volumes:
      - .:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: rippotai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
